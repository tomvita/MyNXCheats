; cheatvm.ini - optional. Put it next to the cheat file:
;   sdmc/atmosphere/contents/<TID>/cheats/cheatvm.ini
; Every line can be left out; the values below are the defaults.

; 1: cheats start on, as with dmnt. 0: start off (Breeze cheat files keep
; "off" variants beside the cheats they undo, so turning all on is wrong).
enabled_by_default = 0

; Menu build only: the chord that opens and closes the menu. Buttons:
; A B X Y L R ZL ZR PLUS MINUS LS RS DUP DDOWN DLEFT DRIGHT
menu_keys = L+R+DDown

; system (the console's shared fonts, every language) or builtin
menu_font = system

; 0: no "menu is here" banner at start
menu_banner = 1

; 1 if a game shows the menu upside down
menu_flip = auto
