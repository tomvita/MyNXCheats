// Black Widow Recharged (Unity IL2CPP). Player01 holds one pickup at a time (PickupSO, skill = id).
// Pickup ids (PickupSkill): 1 RapidFire, 2 SpreadShot, 3 SideAttacks, 4 Burst, 5 ExplosiveBullets,
// 6 Slowdown, 8 OrbitingBullets (ring), 9 Fear, 10 RailGun, 13 Resurrect (co-op only: revives the dead partner; crashes solo, so no spawn cheat), 16 ? (instant), 17 BulletTrail, 18 money.
// Patch cheats write the game's own word first, then the patch (Breeze takes the first store as the original).

[cheat Score x8]
codes = 04000000 {score_add} {score_stock}
        04000000 {score_add} {score_x8}
on    = no

[cheat God mode]
codes = 04000000 {destroy_player_check} 35000068
        04000000 {destroy_player_check} 14000003

[cheat Pickups never expire]
codes = 04000000 {pickup_timer_add} BD003A60
        04000000 {pickup_timer_add} D503201F
        04000000 {orbit_timer_add} BD005660
        04000000 {orbit_timer_add} D503201F

// A timed pickup you already hold is kept: a new timed pickup touched is used up but ignored.
// Instant ones (railgun blast, resurrect, money) still work.
[cheat Keep current pickup]
hook = pickup_type_site
on   = no
code =
    {original}
    cmp w8, #2
    b.ne out
    ldr x9, [x19, #0x48]
    cbz x9, out
    ldr x10, [x19, #0x40]
    cmp x9, x10
    b.eq out
    ldr w9, [x9, #0x1c]
    cmp w9, #2
    b.ne out
    b {pickup_skip}
  out:
    b code1+4

[cheat Dropped pickups never vanish]
codes = 04000000 {pickup_countdown_state} 540002E0
        04000000 {pickup_countdown_state} 54000620
on    = no

[cheat Blast always charged]
codes = 04000000 {blast_check_p1} 34000288
        04000000 {blast_check_p1} D503201F
        04000000 {blast_check_p2} 34000448
        04000000 {blast_check_p2} D503201F
on    = no

// Enemies read this every frame. Turn "normal" on once to put it back after another value.
[cheat Enemy speed]
template = yes
chain = {global_settings_slot} B8 18
write = f32 1.0

[mod Enemy speed]
cheat  = Enemy speed
values = normal = 1.0; slow = 0.3; very slow = 0.1; frozen = 0

[cheat Always spawn RapidFire (1)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800020
on    = no

[cheat Always spawn SpreadShot (2)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800040
on    = no

[cheat Always spawn SideAttacks (3)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800060
on    = no

[cheat Always spawn Burst (4)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800080
on    = no

[cheat Always spawn ExplosiveBullets (5)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 528000A0
on    = no

[cheat Always spawn Slowdown (6)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 528000C0
on    = no

[cheat Always spawn OrbitingBullets ring (8)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800100
on    = no

[cheat Always spawn Fear (9)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800120
on    = no

[cheat Always spawn RailGun (10)]
codes = 04000000 {powerup_pick} B9402100
        04000000 {powerup_pick} 52800140
on    = no

[cheat Always spawn money (18)]
