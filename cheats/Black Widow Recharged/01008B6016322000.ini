        04000000 {powerup_pick} 52800240
on    = no

[build 60CB539D3F2EF5F4]
// StatsManager::AddScore: add w1, w8, w20 (old score + points)
score_add              = M+1601A60 stock 0B140101
// the same add with points << 3 (its registers change between builds)
score_stock            = 0x0B140101
score_x8               = 0x0B140D01
// Player01::DestroyPlayer: cbnz w8 (IsImmortal) -> return
destroy_player_check   = M+173AFF4 stock 35000068
// Player01::Update: str s0, [x19,#0x38] (powerupTimer += deltaTime)
pickup_timer_add       = M+173A5B4 stock BD003A60
// OrbitingBullets::Update: str s0, [x19,#0x54] (timer += deltaTime)
orbit_timer_add        = M+17356D0 stock BD005660
// Player01::ProccessPickup: ldr w8, [x20,#0x1c] (new pickup's PickupType)
pickup_type_site       = M+1739D38 stock B9401E88
// Player01::ProccessPickup tail: strb wzr, [x19,#0xdc] then return
pickup_skip            = M+173A200
// <StartCountdown>d__17::MoveNext: b.eq to the release (pickup despawn after howLongUntilDeath)
pickup_countdown_state = M+16B1DF0 stock 540002E0
// PickupProgressBar::CheckIfCanUse: cbz on player1CanUsePickup / player2CanUsePickup
blast_check_p1         = M+1738C30 stock 34000288
blast_check_p2         = M+1738BF8 stock 34000448
// PowerupSpawner::SelectRandomPowerup: ldr w0, [x8,#0x20] (the drop list's pickup id)
powerup_pick           = M+1740570 stock B9402100
// GlobalSettings klass slot; static block +0x18 = EnemiesSpeedModifier
global_settings_slot   = M+43E40E8

