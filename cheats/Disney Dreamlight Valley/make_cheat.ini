; Make cheat recipes for Disney Dreamlight Valley 1.26.1.
; build 3346726B2F640E01
; The Cheats menu's Make cheat button reads this file; the format is in make_db_cheat.md.
;
; How it works (what you get changes, nothing is made out of nothing): "Give item hook (needed by Give cheats)" hooks Meta.ContainerInventory::AddItem
; (M+4F9AB20). While a Get cheat's key is held, whatever goes into your backpack becomes the chosen
; item and amount: hold the key while you pick up, harvest, forage or buy anything. The game adds an
; item on its server side and on its client side; both happen while the key is held, so both copies
; (and the save) agree. A stack seems to hold at most 50.

[Get an item]
name            = Get {count} {name} ({key})
data            = items.tsv
show            = {name}   {cat:names}
search          = name
filter          = cat
ask             = count 1-999 default 50
key             = R
key_mode        = held
requires        = Give item hook (needed by Give cheats)
code            = {keycond}
                  04000000 0C577FF4 {count}
                  04000000 0C577FF0 {id}
                  20000000

[cat names]
1  = Crops and fruit
2  = Seeds
3  = Flowers
4  = Fish
5  = Ingredients
6  = Gems and minerals
7  = Meals
8  = Materials and misc
9  = Elixirs
10 = Ephemeral
11 = Gifts and loot
