[cheat asd]
was_after = Escape always allowed
shelved = yes
hook = asd_site
on = no
code =
    ldr x10, [x9]
    ldr x10, [x9]
    ldr x10, [x9]
    ldr x29, a
    stp x29, x30, [sp], #0x20
    return:
    b code1+4
    a:.quad 100
