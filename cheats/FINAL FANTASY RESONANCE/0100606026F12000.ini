// Cheat source for FINAL FANTASY RESONANCE (0100606026F12000), every build.
// Format: cheat_source.md in the Breeze repo. Names in {braces} come from the
// [build] section of the running build; a new game version needs only a new
// [build] section with the same names.
//
// Ported from the demo (0100517027E86000, DD0DC94DA6F6E6D7): all four hook
// sites are word-for-word the same code in 1.0.1, found by the demo's .aob
// signatures. Write-up of the HP chain: FFRS_hp_chain.md in the Breeze repo.
//
// Battle stat object (native, no reflection): +0xFC unit id, +0x10C HP,
// +0x110 MP, +0x434/+0x438 the published copies the HUD reads. Party ids are
// 1000..1999 (the player is 1006); enemies in the first battle read 1 and 278.
// Max HP / MP are computed, never stored, so these hook the clamps where the
// game already holds the max in w0.

[cheat Full HP (party)]
hook = hp_site
unit = HP and one-hit kill
on = no
code =
    // SetCurrentHP: w8 = clamp(requested, 0, max), w0 = max, x20 = stat object.
    {original}
    ldr w8, [x20, #0xfc]
    cmp w8, #1000
    b.lt enemy
    cmp w8, #2000
    b.ge enemy
    str w0, [x20, #0x10c]
    b code1+4
  enemy:
    // An enemy keeps its own path back: a shared tail would run for the party too.
    // One-hit kill only lowers HP to 5, never raises it: writing 5 over the
    // 0 of a killing blow would keep the enemy alive for ever.
    ldr w9, one_hit_kill
    cbz w9, done
    ldr w8, [x20, #0x10c]
    cmp w8, #5
    b.le done
    mov w8, #5
    str w8, [x20, #0x10c]
  done:
    b code1+4
  one_hit_kill: .word 0

[mod One-hit kill]
cheat = Full HP (party)
at = one_hit_kill
type = u32
values = off = 0; on = 1

[cheat Full MP (party)]
hook = mp_site
on = no
code =
    // The hook replaces csel w8, w24, w0, lt (w24 = incoming MP, w0 = max,
    // x19 = stat object). The unit id test destroys the flags that csel
    // reads, so the enemy path compares again before it.
    ldr w8, [x19, #0xfc]
    cmp w8, #1000
    b.lt enemy
    cmp w8, #2000
    b.ge enemy
    mov w8, w0
    b code1+4
  enemy:
    cmp w24, w0
    csel w8, w24, w0, lt
    b code1+4

[cheat Item quantity]
hook = qty_site
unit = Item count
on = no
code =
    // The game reads an item's count from [x21 + 4]: write the value there first.
    ldr w9, item_count
    str w9, [x21, #4]
    b code1+4
  item_count: .word 100

[mod Item quantity]
cheat = Item quantity
at = item_count
type = u32
values = 100; 9

[cheat Gil]
hook = gil_site
unit = Money
on = no
code =
    // Gil getter: ldr w0, [x8, #0x28] / ldp / ret. Write the value, return it.
    ldr w0, gil_value
    str w0, [x8, #0x28]
    b code1+4
  gil_value: .word 1000000

[mod Gil]
cheat = Gil
at = gil_value
type = u32
values = 1000000; 9999999

// Difficulty rates. The current difficulty's row of the difficulty table is
// [M+slot]: +0C enemy HP, +10 break points, +14 agility, +18 damage taken,
// +1C damage dealt, +20 EXP, +24 gil, +28 MR points (floats, all 1.0 on the
// first difficulty). Only the eight getters read the slot, each with one
// native caller; the damage two are applied by side (taken when the target is
// the party's, dealt when the attacker is). The hooks multiply what the getter
// returns, so a difficulty's own rate still counts. Turn the hook on, then
// pick a value.

[cheat EXP multiplier hook]
hook = exp_rate_site
unit = EXP multiplier
on = no
code =
    {original}
    ldr s0, exp_factor
    fmul s8, s8, s0
    b code1+4
  exp_factor: .float 1.0

[mod EXP]
cheat = EXP multiplier hook
at = exp_factor
type = f32
values = x1 = 1.0; x2 = 2.0; x4 = 4.0; x10 = 10.0

[cheat Gil multiplier hook]
hook = gil_rate_site
unit = Gil multiplier
on = no
code =
    {original}
    ldr s0, gil_factor
    fmul s8, s8, s0
    b code1+4
  gil_factor: .float 1.0

[mod Gil earned]
cheat = Gil multiplier hook
at = gil_factor
type = f32
values = x1 = 1.0; x2 = 2.0; x4 = 4.0; x10 = 10.0

[cheat MR points multiplier hook]
hook = mr_rate_site
unit = MR points multiplier
on = no
code =
    {original}
    ldr s0, mr_factor
    fmul s8, s8, s0
    b code1+4
  mr_factor: .float 1.0

[mod MR points]
cheat = MR points multiplier hook
at = mr_factor
type = f32
values = x1 = 1.0; x2 = 2.0; x4 = 4.0; x10 = 10.0

[cheat Damage dealt multiplier hook]
hook = dmg_given_rate_site
unit = Damage dealt multiplier
on = no
code =
    {original}
    ldr s0, dmg_given_factor
    fmul s8, s8, s0
