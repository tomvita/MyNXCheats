  dmg_taken_factor: .float 1.0

[mod Damage taken]
cheat = Damage taken multiplier hook
at = dmg_taken_factor
type = f32
values = x1 = 1.0; x0.5 = 0.5; none = 0.0

// Damage cap: both damage functions pick 9999 when the attacker is on the
// party's side and 99999 otherwise (csel wN, w9 = 9999, w8 = 99999, eq), before
// passives raise it. Taking w8 gives the party the enemies' cap.
[cheat Damage cap 99999 (party)]
hook = dmg_cap_site_1
unit = Damage cap 99999
on = no
code =
    mov w22, w8
    b code1+4

[cheat Damage cap 99999 (party) second function]
hook = dmg_cap_site_2
part_of = Damage cap 99999 (party)
on = no
code =
    mov w23, w8
    b code1+4

// CanEscape: cset w0, ne on the battle's escape flag (+0x130). Story and boss
// battles say no; escaping one of them may break the story, so use it with care.
[cheat Escape always allowed]
hook = can_escape_site
on = no
code =
    mov w0, #1
    b code1+4

// Save anywhere: the System menu (M+43A68B0, one call per entry) shows an entry
// that needs a save point only when IsTouchSavePoint (M+41E6468) says so. The
// hook replaces that call with true, so Save is listed everywhere. Places the
// game marks as no-save (CPP_Map_CannotSaveArea) may not be safe to save in.
[cheat Save anywhere]
hook = save_menu_site
on = no
code =
    mov w0, #1
    b code1+4

// Limit gauge: the add function (M+43BF430: add w1 to the gauge, clamped to
// the max) stores at stat+0x118, max at stat+0x2A0. The debug library's
// SetAllUnitLimitBurstPointMax goes through it too. The cset after the store
// reads flags from before it, so the cave keeps them.
[cheat Full limit gauge on gain (party)]
hook = lb_store_site
on = no
code =
    mrs x16, nzcv
    ldr w17, [x19, #0xfc]
    sub w17, w17, #1000
    cmp w17, #1000
    b.hs keep
    ldr w10, [x19, #0x2a0]
  keep:
    str w10, [x19, #0x118]
    msr nzcv, x16
    b code1+4

// The gauge add function only runs when the gauge gains, and the battle setup
// resets the gauge after the max is computed, so a fill at setup does not stay.
// The stat object's parameter getter (func M+43BFFD0, the gauge case at
// M+43C0394: ldr w20, [x19, #0x118]) is what the battle reads on a unit's
// turn: for a party unit, set the gauge to its max there and return that.
// Only mov / ret follow, so the flags are free.
[cheat Full limit gauge at battle start (party)]
hook = lb_get_site
on = no
code =
    ldr w16, [x19, #0xfc]
    sub w16, w16, #1000
    cmp w16, #1000
    b.hs plain
    ldr w20, [x19, #0x2a0]
    str w20, [x19, #0x118]
    b code1+4
  plain:
    {original}
    b code1+4

// Walk through walls: Unreal's UPrimitiveComponent::MoveComponentImpl
// (M+2A1DF80; x0 component, x1 delta, x2 rotation, w3 bSweep, x4 hit) sweeps a
// move against the world only when bSweep is set. For the player's capsule
// (owner at component+0xA0 whose vtable is the field player's) clear it: walls
// stop blocking, while the floor check keeps using its own traces.
// Shelved: a step into rock leaves no standable floor, so every later step is
// put back and the player is stuck inside the wall.
[cheat Walk through walls]
shelved = yes
hook = move_component_site
on = no
code =
    ldr x16, [x0, #0xa0]
    cbz x16, plain
    ldr x16, [x16]
    adrp x17, {player_unit_vtable:page}
    add x17, x17, {player_unit_vtable:lo12}
    cmp x16, x17
    b.ne plain
    mov w3, wzr
  plain:
    {original}
    b code1+4

// Teleport to the World Map cursor. The map's view model (x0 of M+43800F8,
// its cursor-to-world function, run every frame while the map is open) holds
// the cursor as UV (+0x2F0 u, +0x2F8 v) and the map size (+0x328, +0x330) and
// offset (+0x338, +0x340). Measured on two points (Current Position):
//   field X = (0.5 - v) * [+0x330] - [+0x340],  field Y = (u - 0.5) * [+0x328] + [+0x338]
// tp_data: +0 request (1 = go), +8 the field player unit, stored by the capture
// hook while it moves. It must be in writable memory (the end of .bss): a
// cave in the code segment that stores to its own page crashes the game. Position: capsule (unit+0x648) +0x108, +0x140, +0x200.
[cheat Teleport capture (player)]
hook = move_component_site
unit = Teleport
on = no
code =
    ldr x16, [x0, #0xa0]
    cbz x16, plain
    ldr x9, [x16]
    adrp x17, {player_unit_vtable:page}
    add x17, x17, {player_unit_vtable:lo12}
    cmp x9, x17
    b.ne plain
    adrp x17, {tp_data:page}
    add x17, x17, {tp_data:lo12}
    str x16, [x17, #8]
  plain:
    {original}
    b code1+4

[cheat Teleport map hook]
hook = map_cursor_site
unit = Teleport
on = no
code =
    adrp x16, {tp_data:page}
    add x16, x16, {tp_data:lo12}
    ldr w17, [x16]
    cmp w17, #1
    b.ne done
    ldr x17, [x16, #8]
    cbz x17, done
    ldr x9, [x17]
    adrp x10, {player_unit_vtable:page}
    add x10, x10, {player_unit_vtable:lo12}
    cmp x9, x10
    b.ne done
    ldr x17, [x17, #0x648]
    cbz x17, done
    fmov d18, #0.5
    ldr d16, [x0, #0x2f8]
    fsub d16, d18, d16
    ldr d17, [x0, #0x330]
    fmul d16, d16, d17
    ldr d17, [x0, #0x340]
    fsub d16, d16, d17
    ldr d17, [x0, #0x2f0]
    fsub d17, d17, d18
    ldr d18, [x0, #0x328]
    fmul d17, d17, d18
    ldr d18, [x0, #0x338]
    fadd d17, d17, d18
    ldr d18, tp_drop_z
    stp d16, d17, [x17, #0x108]
    str d18, [x17, #0x118]
    stp d16, d17, [x17, #0x140]
    str d18, [x17, #0x150]
    add x10, x17, #0x200
    stp d16, d17, [x10]
    str d18, [x10, #0x10]
  done:
    {original}
    b code1+4
    .align 3
  tp_drop_z: .double 1500.0

[cheat Teleport to map cursor (ZR+X)]
unit = Teleport
codes = 04000000 {tp_data} 00000000
        80000204
        04000000 {tp_data} 00000001
        20000000

// Moon jump: while held, the field player rises. Runs from the map manager's
// function (M+41BA3E0, about 13 times a second, also while standing; the move
// function is not called for a player standing still). Sets the movement
// component's (unit+0x330) velocity Z (+0xE0; velocity is +0xD0) and the mode
// byte (+0x231) to 3 = falling: the game's own falling code then moves and
// steers, and landing switches back to walking. Needs Teleport capture (player)
// on: it stores the player at tp_data+8. tp_data+4 is the held flag.
[cheat Moon jump hook]
hook = moon_site
on = no
code =
    adrp x16, {tp_data:page}
    add x16, x16, {tp_data:lo12}
    ldr w17, [x16, #4]
    cbz w17, plain
    ldr x17, [x16, #8]
    cbz x17, plain
    ldr x9, [x17]
    adrp x10, {player_unit_vtable:page}
    add x10, x10, {player_unit_vtable:lo12}
    cmp x9, x10
    b.ne plain
    ldr x17, [x17, #0x330]
    cbz x17, plain
    ldr d16, moon_vz
    str d16, [x17, #0xe0]
    mov w9, #3
    strb w9, [x17, #0x231]
  plain:
    {original}
    b code1+4
    .align 3
  moon_vz: .double 600.0

[cheat Moon jump (hold ZL+B)]
codes = 04000000 {tp_moon} 00000000
        80000102
        04000000 {tp_moon} 00000001
        20000000

// Random encounters: the map manager counts the distance left before an
// encounter down at +0x1A8 (start value +0x1AC), in M+41BA3E0: left -= step
// each frame, a battle when it reaches 0. The hook scales this frame's step
// (fmul s0, s9, s1); s1 is reloaded right after, so it is free.
[cheat Encounter rate hook]
hook = encount_step_site
unit = Encounter rate
on = no
code =
    {original}
    ldr s1, encount_factor
    fmul s0, s0, s1
    b code1+4
  encount_factor: .float 1.0

[mod Encounter rate]
cheat = Encounter rate hook
at = encount_factor
type = f32
values = x1 = 1.0; none = 0.0; x0.5 = 0.5; x2 = 2.0; x4 = 4.0; immediate = 100000.0

// Field movement: CPP_MapUnit_Playable's max-speed setter (vtable+0xAC0) gets
// the speed of the current gait in s0 (walk +0x86C, run +0x870, dash +0x874 of
// the unit) and writes it to the movement component. The hook scales s0 at its
// entry, so it takes effect the next time the gait changes.
[cheat Move speed hook]
hook = move_speed_site
unit = Move speed
on = no
code =
    ldr s1, move_speed_factor
    fmul s0, s0, s1
    {original}
    b code1+4
  move_speed_factor: .float 1.0

[mod Move speed]
cheat = Move speed hook
at = move_speed_factor
type = f32
values = x1 = 1.0; x1.5 = 1.5; x2 = 2.0; x3 = 3.0

