  dmg_given_factor: .float 1.0

[mod Damage dealt]
cheat = Damage dealt multiplier hook
at = dmg_given_factor
type = f32
values = x1 = 1.0; x2 = 2.0; x10 = 10.0; x100 = 100.0

[cheat Damage taken multiplier hook]
hook = dmg_taken_rate_site
unit = Damage taken multiplier
on = no
code =
    {original}
    ldr s0, dmg_taken_factor
