; FINAL FANTASY RESONANCE recipes for Make cheat (Cheats menu, R+ZL).
; Execute (ZR+X) gives the item at once, without making a cheat: the give
; hook hands it to the game on the next frame.

[Give item]
name            = Give {count} {name} ({key})
data            = items.tsv
show            = {id}   {name}   {cat:names}
search          = name
filter          = cat
exclude         = cat 9
ask             = count 1-99 default 99
key             = ZL+ZR+X
key_mode        = down
requires        = Give item hook (needed by Give cheats)
code            = {keycond}
                  04000000 {give_count} {count}
                  04000000 {give_id} {id}
                  20000000

[cat names]
1 = Consumable
2 = Equipment
3 = Character item
4 = Key item / material
5 = Accessory / special
9 = Unused or debug
