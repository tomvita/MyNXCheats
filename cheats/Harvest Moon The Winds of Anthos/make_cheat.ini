; Make cheat recipes for Harvest Moon The Winds of Anthos (build A753E6CFC9A3A3D9).
; The Cheats menu's Make cheat button reads this file; the format is in make_db_cheat.md.

[Give item]
name            = Give {count} {name} ({key})
data            = items.tsv
show            = {name}   {cat:names}   {sell}G
search          = name
filter          = cat
exclude         = cat 23-35
ask             = count 1-999 default 99
key             = ZL+ZR+X
key_mode        = down
requires        = Give item hook (needed by Give cheats)
requires_script = Give item hook (needed by Give cheats).txt
requires_hook   = M+2DDCED0
requires_stock  = F9401400
code            = {keycond}
                  04000000 075D8FF4 {count}
                  04000000 075D8FF0 {id}
                  20000000

[cat names]
1  = Seeds
3  = Flowers
4  = Animal feed
5  = Fertilizer
6  = Bait
7  = Farm items
8  = Medicine and misc
9  = Spices
10 = Crops
11 = Fish
