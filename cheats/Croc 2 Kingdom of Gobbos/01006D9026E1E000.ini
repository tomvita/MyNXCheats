// Croc 2 Kingdom of Gobbos (remaster, native). Player strat slot + the global game block.

[cheat Moon jump (hold ZL+B)]
chain = {player_slot} 150
write = u32 256
key   = ZL+B
on    = no

[cheat Move speed x2 (player)]
hook = move_site
on   = no
code =
    adrp x8, {player_slot:page}
    ldr x8, [x8, #{player_slot:lo12}]
    sub x9, x0, x8
    cmp x9, #0x4c
    b.eq scale
    cmp x9, #0x54
    b.ne out
  scale:
    ldr w9, [x0]
    sub w10, w20, w9
    add w11, w10, #0x400
    cmp w11, #0x800
    b.hs out
    add w20, w20, w10
  out:
    {original}
    b code1+4

[cheat Infinite hearts]
codes = 01000000 {debug_flags} 00000004
on    = no

[cheat Infinite hearts OFF (turn on once then off)]
codes = 01000000 {debug_flags} 00000000
on    = no

[cheat Hearts 9 of 9]
codes = 08000000 {hearts_max} 00000009 00000009
on    = no

[cheat Total crystals 9999]
chain = {crystals_total}
write = u32 9999
on    = no

[cheat Crystals in level 100]
chain = {crystals_level}
write = u32 100
on    = no

[cheat Keys 9]
chain = {keys}
write = u32 9
on    = no

[cheat Jellies 9 (red blue green)]
codes = 08000000 {jelly_red} 00000009 00000009
        04000000 {jelly_green} 00000009
on    = no

[cheat Clockwork gobbos 9]
chain = {clockwork}
write = u32 9
on    = no

[cheat Binoculars]
chain = {binoculars}
write = u32 1
on    = no

[build B5201EB3D57D5931]
player_slot    = M+6A5DF8
move_site      = M+48FD0 stock B9000014
debug_flags    = M+673F00
hearts_max     = M+68CB2C
crystals_total = M+68CB40
crystals_level = M+68CBE0
binoculars     = M+68CBE4
keys           = M+68CBE8
jelly_red      = M+68CBEC
jelly_green    = M+68CBF4
clockwork      = M+68CBFC
