; Make cheat recipes for Harvest Moon Echoes of Teradea (build 3DCC79312B977CD1).
; The Cheats menu's Make cheat button reads this file; the format is in make_db_cheat.md.

[Give item]
name            = Give {count} {name} ({key})
data            = items.tsv
show            = {name}   {cat:names}   {sell}G
search          = name
filter          = cat
exclude         = cat 31-45
ask             = count 1-999 default 99
key             = ZL+ZR+X
key_mode        = down
requires        = Give item hook (needed by Give cheats)
requires_script = Give item hook (needed by Give cheats).txt
requires_hook   = M+2374D20
requires_stock  = FC1C0FE8
code            = {keycond}
                  04000000 0A8BE108 {count}
                  04000000 0A8BE10C {id}
                  20000000

