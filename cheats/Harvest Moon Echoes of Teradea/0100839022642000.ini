[cheat Teleport to brown map marker hook]
hook = teleport_site
place = fixed
code =
    // Teleport to map marker hook, at Player::ExternalUpdate (x0 = Player, s0 = frame time).
    // The key cheat writes 1 to [main+A8BE110]. The brown marker (MapIconInfo, GameInfo+0xD0,
    // _markedIconDataList[0]) holds a map-canvas position; WorldMapController's statics turn it
    // into world x/z (x = cx / rate - off.x, z = cy / rate - off.z). The ground height comes from
    // Physics.Raycast straight down from y 1000 on the ground layers only (Default, Stage,
    // StageObject = 0x481 from App.LayerMaskConstants; with all layers it landed on an invisible
    // area wall at the map edge), triggers ignored; then CharacterBase::Warp.
    // The world is loaded in parts near the player, so far away the ray finds nothing at
    // first: the player is then held above the marker at the height they started from + 10
    // (kept in [main+A8BE104]) and the ray is retried every
    // frame (the flag counts the tries) until the ground there has loaded, for at most 600
    // frames. Nothing happens when the marker is not placed.
    adrp x16, {teleport_flag:page}
    ldr w17, [x16, #{teleport_flag:lo12}]
    cbz w17, orig
    stp x29, x30, [sp, #-0x90]!
    mov x29, sp
    stp x0, x19, [sp, #0x10]
    str d0, [sp, #0x20]
    stp d8, d9, [sp, #0x28]
    mov x19, x0
    adrp x8, {game_info_slot:page}
    ldr x8, [x8, #{game_info_slot:lo12}]
    cbz x8, done
    ldr x8, [x8, #0xb8]
    cbz x8, done
    ldr x8, [x8]
    cbz x8, done
    ldr x8, [x8, #0xd0]
    cbz x8, done
    ldr x8, [x8, #0x10]
    cbz x8, done
    ldr w9, [x8, #0x18]
    cbz w9, done
    ldr x8, [x8, #0x20]
    cbz x8, done
    ldr w9, [x8, #0x14]
    cbz w9, nomark
    ldr s8, [x8, #0x18]
    ldr s9, [x8, #0x1c]
    adrp x8, {world_map_klass_slot:page}
    ldr x8, [x8, #{world_map_klass_slot:lo12}]
    cbz x8, done
    ldr x8, [x8]
    cbz x8, done
    ldr x8, [x8, #0xb8]
    cbz x8, done
    ldr s1, [x8, #0x14]
    fcmp s1, #0.0
    b.eq done
    ldr s2, [x8, #0x18]
    ldr s3, [x8, #0x20]
    fdiv s8, s8, s1
    fsub s8, s8, s2
    fdiv s9, s9, s1
    fsub s9, s9, s3
    fmov s0, s8
    movz w8, #0x447a, lsl #16
    fmov s1, w8
    fmov s2, s9
    fmov s3, wzr
    fmov s4, #-1.0
    fmov s5, wzr
    movz w8, #0x44fa, lsl #16
    fmov s6, w8
    add x0, sp, #0x40
    mov w1, #0x481
    mov w2, #1
    bl {Physics_Raycast}
    adrp x16, {teleport_flag:page}
    cbz w0, miss
    str wzr, [x16, #{teleport_flag:lo12}]
    ldr s1, [sp, #0x44]
    b warp
    miss:
    ldr w17, [x16, #{teleport_flag:lo12}]
    cmp w17, #1
    b.ne count
    ldr x0, [x19, #0x118]
    cbz x0, done
    mov x1, xzr
    bl {Rigidbody_get_position}
    fmov s3, #10.0
    fadd s1, s1, s3
    adrp x16, {teleport_height:page}
    str s1, [x16, #{teleport_height:lo12}]
    count:
    ldr w17, [x16, #{teleport_flag:lo12}]
    add w17, w17, #1
    cmp w17, #600
    csel w17, wzr, w17, gt
    str w17, [x16, #{teleport_flag:lo12}]
    ldr s1, [x16, #{teleport_height:lo12}]
    warp:
    fmov s0, s8
    fmov s2, s9
    fmov s3, wzr
    fmov s4, wzr
    fmov s5, wzr
    mov x0, x19
    mov x1, xzr
    bl {CharacterBase_Warp}
    b done
    nomark:
    adrp x16, {teleport_flag:page}
    str wzr, [x16, #{teleport_flag:lo12}]
    done:
    ldp d8, d9, [sp, #0x28]
    ldr d0, [sp, #0x20]
    ldp x0, x19, [sp, #0x10]
    ldp x29, x30, [sp], #0x90
    orig:
    {original}
    b code1+4

[cheat Clear field obstacles hook]
hook = obstacles_site
place = fixed
code =
    // Clear field obstacles hook, at CropFieldController::ExternalUpdate (x0 = field, every frame).
    // The key cheat writes 1 to [main+A8BE118]; the field the player stands in clears it and
    // removes every weed, stone and stump: Weed(row, col, &result) on tiles whose obstacle has
    // a model (the game's own weeding: gives the item, destroys the model), FurrowInfo::GoBackFurrow
    // on the other tiles of a big obstacle.
    adrp x16, {obstacles_flag:page}
    ldr w17, [x16, #{obstacles_flag:lo12}]
    cbz w17, orig
    ldrb w17, [x0, #0x50]
    cbz w17, orig
    ldr w17, [x0, #0x54]
    cbz w17, orig
    str wzr, [x16, #{obstacles_flag:lo12}]
    stp x29, x30, [sp, #-0x70]!
    mov x29, sp
    stp x19, x20, [sp, #0x10]
    stp x21, x22, [sp, #0x20]
    stp x0, x1, [sp, #0x30]
    str d0, [sp, #0x40]
    mov x19, x0
    mov w20, #0
    r_loop:
    ldr w8, [x19, #0x54]
    cmp w20, w8
    b.ge done
    mov w21, #0
    c_loop:
    ldr w8, [x19, #0x58]
    cmp w21, w8
    b.ge r_next
    madd w11, w8, w20, w21
    ldr x9, [x19, #0x48]
    cbz x9, done
    ldr w10, [x9, #0x18]
    cmp w11, w10
    b.ge c_next
    ldr x9, [x9, #0x10]
    add x9, x9, #0x20
    ldr x9, [x9, w11, uxtw #3]
    cbz x9, c_next
    ldr x22, [x9, #0x40]
    cbz x22, c_next
    ldr x10, [x22, #0x20]
    cbz x10, c_next
    ldr x10, [x9, #0x48]
    cbz x10, part
    mov x0, x19
    mov w1, w20
    mov w2, w21
    add x3, sp, #0x50
    stp xzr, xzr, [sp, #0x50]
    bl {CropFieldController_Weed}
    b c_next
    part:
    mov x0, x22
    mov x1, xzr
    bl {FurrowInfo_GoBackFurrow}
    c_next:
    add w21, w21, #1
    b c_loop
    r_next:
    add w20, w20, #1
    b r_loop
    done:
    ldr d0, [sp, #0x40]
    ldp x0, x1, [sp, #0x30]
    ldp x21, x22, [sp, #0x20]
    ldp x19, x20, [sp, #0x10]
    ldp x29, x30, [sp], #0x70
    orig:
    {original}
    b code1+4

[cheat Moon jump hook]
hook = moon_jump_site
place = fixed
code =
    // Moon jump hook, at Player::ExternalFixedUpdate (x0 = Player, s0 = tick time, every physics tick).
    // The key cheat keeps [main+A8BE114] at 1 while the keys are held and 0 otherwise. While it is
    // set, the player's Rigidbody (+0x118) has gravity off, its position is raised 0.5 and its vertical speed zeroed every tick
    // (the mover overwrites the velocity, so a speed alone does not lift);
    // the byte [main+A8BE11C] remembers that gravity was turned off. On release, once: gravity
    // back on and upward speed 0.
    adrp x16, {moon_jump_flag:page}
    ldr w17, [x16, #{moon_jump_flag:lo12}]
    cbnz w17, lift
    ldrb w17, [x16, #{moon_jump_gravity:lo12}]
    cbz w17, orig
    strb wzr, [x16, #{moon_jump_gravity:lo12}]
    stp x29, x30, [sp, #-0x30]!
    mov x29, sp
    stp x0, x19, [sp, #0x10]
    str d0, [sp, #0x20]
    ldr x19, [x0, #0x118]
    cbz x19, done
    mov x0, x19
    mov w1, #1
    mov x2, xzr
    bl {Rigidbody_set_useGravity}
    mov x0, x19
    mov x1, xzr
    bl {Rigidbody_get_velocity}
    fmov s1, wzr
    b setv
    lift:
    mov w17, #1
    strb w17, [x16, #{moon_jump_gravity:lo12}]
    stp x29, x30, [sp, #-0x30]!
    mov x29, sp
    stp x0, x19, [sp, #0x10]
    str d0, [sp, #0x20]
    ldr x19, [x0, #0x118]
    cbz x19, done
    mov x0, x19
    mov w1, wzr
    mov x2, xzr
    bl {Rigidbody_set_useGravity}
    mov x0, x19
    mov x1, xzr
    bl {Rigidbody_get_position}
    movz w8, #0x3f00, lsl #16
    fmov s3, w8
    fadd s1, s1, s3
    mov x0, x19
    mov x1, xzr
    bl {Rigidbody_set_position}
    mov x0, x19
    mov x1, xzr
    bl {Rigidbody_get_velocity}
    fmov s1, wzr
    setv:
    mov x0, x19
    mov x1, xzr
    bl {Rigidbody_set_velocity}
    done:
    ldr d0, [sp, #0x20]
    ldp x0, x19, [sp, #0x10]
    ldp x29, x30, [sp], #0x30
    orig:
    {original}
    b code1+4

[cheat Move speed (player)]
// At ActionStateMove after GetSpeed: the player's speed times the factor in
// move_speed_factor, other characters unchanged (_ownerIsPlayer +0x2C).
// [mod Move speed] sets the factor.
hook = speed_site
place = fixed
code =
    ldrb w9, [x19, #0x2c]
    cbz w9, plain
    ldr s11, move_speed_factor
    fmul s11, s0, s11
    b code1+4
    plain:
    {original}
    b code1+4
    move_speed_factor: .float 1.0

[mod Move speed]
cheat = Move speed (player)
at = move_speed_factor
type = f32
values = 1.0; 2.0; 4.0; 7.0

