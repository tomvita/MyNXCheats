// Cheat source for Harvest Moon: Echoes of Teradea (0100839022642000), every build.
// Format: cheat_source.md in the Breeze repo. Names in {braces} come from the
// [build] section of the running build; a new game version needs only a new
// [build] section with the same names.
//
// Caves sit in App.Debug.DebugMenuConstructorTextTest::CreateWindow (only the
// developer debug menu reaches it), so they are place = fixed: Assemble All
// would repack them into the game's 0x508-byte free tail.  Flag words are the
// never-set init bytes of the debug menu lambdas, M+A8BE104..11D.

[cheat Give item hook (needed by Give cheats)]
hook = give_site
code =
    // Give item hook, at GameInfo::ExternalUpdate (x0 = GameInfo, s0 = frame time).
    // A give cheat writes the count to [main+A8BE108] and then the item id to
    // [main+A8BE10C]; here the id is cleared and the game's own
    // ItemUtil::CommonAddHaveItem(id, quality 0, count, 1, 1, sound 1) is called,
    // the call weeding makes. The two words are never-used init flags of the
    // developer debug menu.
    adrp x16, {give_id:page}
    ldr w17, [x16, #{give_id:lo12}]
    cbz w17, orig
    stp x29, x30, [sp, #-0x30]!
    mov x29, sp
    stp x0, x19, [sp, #0x10]
    str d0, [sp, #0x20]
    mov x19, x16
    ldr w0, [x19, #{give_id:lo12}]
    ldr w2, [x19, #{give_count:lo12}]
    str wzr, [x19, #{give_id:lo12}]
    mov w1, wzr
    mov w3, #1
    mov w4, #1
    mov w5, #1
    mov x6, xzr
    bl {ItemUtil_CommonAddHaveItem}
    ldr d0, [sp, #0x20]
    ldp x0, x19, [sp, #0x10]
    ldp x29, x30, [sp], #0x30
    orig:
    {original}
    b code1+4

